syntax = "proto3";

package utila.greeter.v1;

option go_package = "github.com/cohavisi/utila-gRPC/api/greeter/v1;greeterv1";

service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
}

message HelloReply {
  string message = 1;
  string server_id = 2;
}
